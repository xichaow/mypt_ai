<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Exercise Form Coach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .upload-section:hover {
            border-color: #4ECDC4;
            background: #f0f8f8;
        }

        .upload-section.dragover {
            border-color: #FF6B6B;
            background: #fff5f5;
        }

        .upload-icon {
            font-size: 4em;
            color: #ddd;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .upload-button:hover {
            transform: translateY(-2px);
        }

        .exercise-select {
            margin-bottom: 30px;
        }

        .exercise-select label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .exercise-select select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
            background: white;
        }

        .analyze-button {
            width: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .analyze-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .analyze-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview-section {
            margin-bottom: 30px;
            display: none;
        }

        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .results-section {
            display: none;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-top: 30px;
        }

        .score-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
        }

        .score-low { background: linear-gradient(45deg, #ff4757, #ff3838); }
        .score-medium { background: linear-gradient(45deg, #ffa502, #ff6348); }
        .score-high { background: linear-gradient(45deg, #2ed573, #1e90ff); }

        .risk-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .risk-low { background: #d4edda; color: #155724; }
        .risk-medium { background: #fff3cd; color: #856404; }
        .risk-high { background: #f8d7da; color: #721c24; }

        .feedback-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .feedback-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .feedback-card h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3em;
        }

        .feedback-card ul {
            list-style: none;
        }

        .feedback-card li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            color: #666;
        }

        .feedback-card li:last-child {
            border-bottom: none;
        }

        .safety-note {
            background: #e3f2fd;
            border-left: 5px solid #2196f3;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .feedback-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏋️ Gym Exercise Form Coach</h1>
            <p>AI-powered form analysis for perfect technique</p>
        </div>

        <div class="main-content">
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📸</div>
                <div class="upload-text">
                    <strong>Upload your exercise photo</strong><br>
                    Drag & drop or click to select
                </div>
                <input type="file" class="file-input" id="fileInput" accept="image/*">
                <button class="upload-button" onclick="document.getElementById('fileInput').click()">
                    Choose Photo
                </button>
            </div>

            <div class="exercise-select">
                <label for="exerciseType">Exercise Type (optional - AI will auto-detect if not selected)</label>
                <select id="exerciseType">
                    <option value="">Auto-detect exercise</option>
                    <option value="squat">Squat</option>
                    <option value="deadlift">Deadlift</option>
                    <option value="rdl">Romanian Deadlift (RDL)</option>
                    <option value="bench_press">Bench Press</option>
                    <option value="shoulder_press">Shoulder Press</option>
                </select>
            </div>

            <div class="preview-section" id="previewSection">
                <img class="image-preview" id="imagePreview" alt="Exercise preview">
            </div>

            <button class="analyze-button" id="analyzeButton" onclick="analyzeForm()" disabled>
                Analyze My Form 🚀
            </button>

            <div class="loading" id="loadingSection">
                <div class="spinner"></div>
                <p>Analyzing your form... This may take a few seconds.</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="results-section" id="resultsSection">
                <div class="score-display">
                    <div class="score-circle" id="scoreCircle">
                        <span id="scoreValue">0</span>
                    </div>
                    <h3>Form Score</h3>
                    <span class="risk-badge" id="riskBadge">LOW RISK</span>
                </div>

                <div class="feedback-grid">
                    <div class="feedback-card">
                        <h3>🚨 Issues Found</h3>
                        <ul id="issuesList"></ul>
                    </div>
                    
                    <div class="feedback-card">
                        <h3>💡 Coaching Tips</h3>
                        <ul id="coachingList"></ul>
                    </div>
                </div>

                <div class="safety-note">
                    <h4>🛡️ Safety Note</h4>
                    <p id="safetyNote"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        // File input handling
        document.getElementById('fileInput').addEventListener('change', function(e) {
            handleFileSelect(e.target.files[0]);
        });

        // Drag and drop handling
        const uploadSection = document.getElementById('uploadSection');
        
        uploadSection.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            handleFileSelect(e.dataTransfer.files[0]);
        });

        function handleFileSelect(file) {
            if (!file) return;

            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Please select a valid image file (JPEG, PNG, WebP)');
                return;
            }

            // Validate file size (10MB limit)
            if (file.size > 10 * 1024 * 1024) {
                showError('File size must be less than 10MB');
                return;
            }

            selectedFile = file;

            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewSection').style.display = 'block';
                document.getElementById('analyzeButton').disabled = false;
            };
            reader.readAsDataURL(file);

            hideError();
        }

        async function analyzeForm() {
            if (!selectedFile) {
                showError('Please select an image first');
                return;
            }

            // Show loading
            document.getElementById('loadingSection').style.display = 'block';
            document.getElementById('analyzeButton').disabled = true;
            document.getElementById('resultsSection').style.display = 'none';
            hideError();

            // Prepare form data
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            const exerciseType = document.getElementById('exerciseType').value;
            if (exerciseType) {
                formData.append('exercise_type', exerciseType);
            }

            try {
                const response = await fetch('/api/v1/analyze', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    displayResults(result);
                } else {
                    throw new Error(result.detail?.message || 'Analysis failed');
                }

            } catch (error) {
                showError('Analysis failed: ' + error.message);
            } finally {
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('analyzeButton').disabled = false;
            }
        }

        function displayResults(result) {
            // Update score
            const scoreValue = document.getElementById('scoreValue');
            const scoreCircle = document.getElementById('scoreCircle');
            
            scoreValue.textContent = result.form_score;
            
            // Set score color based on value
            scoreCircle.className = 'score-circle';
            if (result.form_score >= 80) {
                scoreCircle.classList.add('score-high');
            } else if (result.form_score >= 60) {
                scoreCircle.classList.add('score-medium');
            } else {
                scoreCircle.classList.add('score-low');
            }

            // Update risk badge
            const riskBadge = document.getElementById('riskBadge');
            riskBadge.textContent = result.risk_level.toUpperCase() + ' RISK';
            riskBadge.className = 'risk-badge risk-' + result.risk_level;

            // Update issues list
            const issuesList = document.getElementById('issuesList');
            issuesList.innerHTML = '';
            result.key_issues.forEach(issue => {
                const li = document.createElement('li');
                li.textContent = issue;
                issuesList.appendChild(li);
            });

            // Update coaching tips
            const coachingList = document.getElementById('coachingList');
            coachingList.innerHTML = '';
            result.coaching_cues.forEach(cue => {
                const li = document.createElement('li');
                li.textContent = cue;
                coachingList.appendChild(li);
            });

            // Update safety note
            document.getElementById('safetyNote').textContent = result.safety_note;

            // Show results
            document.getElementById('resultsSection').style.display = 'block';
            
            // Scroll to results
            document.getElementById('resultsSection').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
    </script>
</body>
</html>
