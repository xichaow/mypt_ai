services:
  - type: web
    name: gym-form-coach
    env: python
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: "production"